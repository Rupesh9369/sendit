<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#F5F7FA;display:flex;gap:24px;padding:40px;justify-content:center;flex-wrap:wrap}
.card{background:#fff;border-radius:20px;padding:28px;width:300px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.card img{width:180px;height:180px}
h2{margin:18px 0 6px;font-size:28px;color:#111}
p{margin:0;color:#6B7280;font-size:15px}
.tag{margin-top:10px;font-size:13px;color:#374151;font-weight:600}
</style></head><body>
<div class="card"><img src="stashd.svg"><h2>Stashd</h2><p>Save it. Find it later.</p><div class="tag">Tray + sparkle</div></div>
<div class="card"><img src="snatchd.svg"><h2>Snatchd</h2><p>Snatch it. Keep it.</p><div class="tag">Grab swoosh</div></div>
<div class="card"><img src="sendd.svg"><h2>Sendd</h2><p>Send it to your PC.</p><div class="tag">Paper plane</div></div>
</body></html>
